id:
  library: libdefault
  vendor: vendor
  name: axis_async_fifo

parameters:
    DATA_WIDTH: 8
    KEEP_WIDTH: (DATA_WIDTH+7)/8
    ID_WIDTH: 8
    DEST_WIDTH: 8
    USER_WIDTH: 1
    ID_ENABLE: 0
    USER_ENABLE: 1

interfaces:
    s_axis:
        type:
            name: axi4stream
            vendor: vendor
            library: libdefault
        mode: subordinate
        signals:
            in:
                tdata: [s_axis_tdata, DATA_WIDTH-1, 0]
                tkeep: [s_axis_tkeep, KEEP_WIDTH-1, 0]
                tvalid: s_axis_tvalid
                tlast: s_axis_tlast
                tid: [s_axis_tid, ID_WIDTH-1, 0]
                tdest: [s_axis_tdest, DEST_WIDTH-1, 0]
                tuser: [s_axis_tuser, USER_WIDTH-1, 0]
            out:
                tready: s_axis_tready

    m_axis:
        type:
            name: axi4stream
            vendor: vendor
            library: libdefault
        mode: manager
        signals:
            in:
                tready: m_axis_tready
            out:
                tdata: [m_axis_tdata, DATA_WIDTH-1, 0]
                tkeep: [m_axis_tkeep, KEEP_WIDTH-1, 0]
                tvalid: m_axis_tvalid
                tlast: m_axis_tlast
                tid: [m_axis_tid, ID_WIDTH-1, 0]
                tdest: [m_axis_tdest, DEST_WIDTH-1, 0]
                tuser: [m_axis_tuser, USER_WIDTH-1, 0]

signals:
    in:
        - async_rst
        - s_clk
        - m_clk
    out:
        - s_status_overflow
        - s_status_bad_frame
        - s_status_good_frame
        - m_status_overflow
        - m_status_bad_frame
        - m_status_good_frame
