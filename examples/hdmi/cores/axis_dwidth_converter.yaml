id:
  library: libdefault
  vendor: vendor
  name: axis_dwidth_converter

parameters:
    IN_DATA_WIDTH: 64
    OUT_DATA_WIDTH: 32

interfaces:
    s_axis:
        type:
            name: axi4stream
            vendor: vendor
            library: libdefault
        mode: subordinate
        signals:
            in:
                tdata: [s_axis_tdata, IN_DATA_WIDTH-1, 0]
                tvalid: s_axis_tvalid
            out:
                tready: s_axis_tready

    m_axis:
        type:
            name: axi4stream
            vendor: vendor
            library: libdefault
        mode: manager
        signals:
            in:
                tready: m_axis_tready
            out:
                tdata: [m_axis_tdata, OUT_DATA_WIDTH-1, 0]
                tvalid: m_axis_tvalid

signals:
    in:
        - aclk
        - aresetn
