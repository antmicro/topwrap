id:
  name: axis_receiver
  vendor: vendor
  library: libdefault

signals:
  in:
    - clk
    - rst
    - [noise, 15, 0]
  inout:
    - [ext, 31, 0]

interfaces:
  io:
    type:
      name: axi4stream
    mode: subordinate
    signals:
      in:
        tdata: [dat_i, 31, 0]

        # PORT SLICING
        # reversed situation from streamer.yaml
        tvalid: [ctrl_i, 4, 0, 4, 4]
        tkeep: [ctrl_i, 4, 0, 3, 0]
