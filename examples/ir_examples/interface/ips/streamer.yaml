id:
  name: axis_streamer
  vendor: vendor
  library: libdefault

signals:
  in:
    - clk
    - rst

interfaces:
  io:
    type:
      name: axi4stream
    mode: manager
    signals:
      out:
        tdata: [dat_o, 31, 0]

        # PORT SLICING
        # Use bit 0 of the 5 bit "ctrl_o" signal for the TVALID signal
        tvalid: [ctrl_o, 4, 0, 0, 0]
        # Use bits 4..1 for the TKEEP signal
        tkeep: [ctrl_o, 4, 0, 4, 1]
