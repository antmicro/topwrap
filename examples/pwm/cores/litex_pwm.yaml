id:
  library: libdefault
  vendor: vendor
  name: litex_pwm

signals:
  in:
    - sys_clk
    - sys_rst
  out:
    - pwm

interfaces:
  s_axi:
    type:
      name: axi4lite
      vendor: vendor
      library: libdefault
    mode: subordinate
    signals:
      in:
        awaddr: [axi_awaddr, 31, 0]
        awvalid: axi_awvalid
        wdata: [axi_wdata, 31, 0]
        wstrb: [axi_wstrb, 3, 0]
        wvalid: axi_wvalid
        bready: axi_bready
        araddr: [axi_araddr, 31, 0]
        arvalid: axi_arvalid
        rready: axi_rready
      out:
        awready: axi_awready
        wready: axi_wready
        bresp: [axi_bresp, 1, 0]
        bvalid: axi_bvalid
        arready: axi_arready
        rdata: [axi_rdata, 31, 0]
        rresp: [axi_rresp, 1, 0]
        rvalid: axi_rvalid
