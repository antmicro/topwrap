id:
  library: libdefault
  name: coreStream
  vendor: vendor

signals:
  CREADY:
    pattern: cready
    modes: {manager: [in, required]}
  CDATA:
    pattern: cdata
    modes: {manager: [out, required]}
  CKEEP:
    pattern: ckeep
    modes: {manager: [out, required]}
  CVALID:
    pattern: cvalid
    modes: {manager: [out, required]}
