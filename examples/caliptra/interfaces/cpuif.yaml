id:
  name: cpuif
  library: libdefault
  vendor: vendor

signals:
  address:
    pattern: address
    modes: {manager: [out, required]}
  cs:
    pattern: cs
    modes: {manager: [out, required]}
  we:
    pattern: we
    modes: {manager: [out, required]}
  write_data:
    pattern: write_data
    modes: {manager: [out, required]}
  read_data:
    pattern: read_data
    modes: {manager: [in, required]}
