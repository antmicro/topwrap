name: axi_interconnect_example

ips:
  subordinator_axi:
    file: repo[axi]:subordinator_axi

connections:
  ports:
    subordinator_axi:
      clk: clk
      rst: rst

interconnects:
  axi_interconnect:
    type: AXI
    clock: clk
    reset: rst
    params:
      atop: False
    subordinates:
      subordinator_axi:
        example_iface:
          address: 0x0
          size: 0x1000

external:
  ports:
    in:
      - clk
      - rst
