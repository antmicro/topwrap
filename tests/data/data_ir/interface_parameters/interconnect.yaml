name: top

config:
  libraries:
    interface_parameters: .

ips:
  child:
    core: child

external:
  ports:
    in:
      - clk
      - rst
  interfaces:
    in:
      - bus

interconnects:
  fabric:
    type: Wishbone Round-Robin
    clock: clk
    reset: rst
    params:
      addr_width: 32
      data_width: 32
      granularity: 8
      features: []

    managers:
      top:
        - bus

    subordinates:
      child:
        bus:
          address: 0x00000000
          size: 0x1000
