# Signals specification:
# - https://cdn.opencores.org/downloads/wbspec_b4.pdf#page=27
# - https://cdn.opencores.org/downloads/wbspec_b4.pdf#page=69
id:
  library: topwrap-interfaces
  name: wishbone
  vendor: antmicro.com

parameters:
  GRANULARITY: 8
  ADDR_WIDTH: 32
  DATA_WIDTH: 64
  TGA_WIDTH: 32
  TGD_WIDTH: 32
  TGC_WIDTH: 32

signals:
  adr:
    pattern: adr
    modes: {manager: [out, required]}
    bound: ['ADDR_WIDTH-1', '$clog2(DATA_WIDTH/GRANULARITY)'] # TODO are those correct?
  dat_w:
    pattern: mosi|dat_(w|mosi)
    modes: {manager: [out, required]}
    bound: ['DATA_WIDTH-1', '0']
  dat_r:
    pattern: miso|dat_(r|miso)
    modes: {manager: [in, required]}
    bound: ['DATA_WIDTH-1', '0']
  sel:
    pattern: sel
    modes: {manager: [out, required]}
    bound: ['DATA_WIDTH/8-1', '0']
  cyc:
    pattern: cyc
    modes: {manager: [out, required]}
  stb:
    pattern: stb
    modes: {manager: [out, required]}
  we:
    pattern: we
    modes: {manager: [out, required]}
  ack:
    pattern: ack
    modes: {manager: [in, required]}
  err:
    pattern: err
    modes: {manager: [in, optional]}
  rty:
    pattern: rty
    modes: {manager: [in, optional]}
  stall:
    pattern: stall
    modes: {manager: [in, optional]}
  lock:
    pattern: lock
    modes: {manager: [out, optional]}
  cti:
    pattern: cti
    modes: {manager: [out, optional]}
    bound: ['2', '0']
  bte:
    pattern: bte
    modes: {manager: [out, optional]}
    bound: ['1', '0']
  tgd_w:
    pattern: tgd_(w|mosi)
    modes: {manager: [out, optional]}
    bound: ['TGD_WIDTH-1', '0']
  tgd_r:
    pattern: tgd_(r|miso)
    modes: {manager: [in, optional]}
    bound: ['TGD_WIDTH-1', '0']
  tga:
    pattern: tga
    modes: {manager: [out, optional]}
    bound: ['TGA_WIDTH-1', '0']
  tgc:
    pattern: tgc
    modes: {manager: [out, optional]}
    bound: ['TGC_WIDTH', '0']
