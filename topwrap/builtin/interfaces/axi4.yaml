# Signal description
# - https://developer.arm.com/documentation/ihi0022/e (version E), pages: 31,101,113

id:
  library: topwrap-interfaces
  name: axi4
  vendor: antmicro.com

signals:
  # AW channel.
  awid:
    pattern: aw[._]?id
    modes: {manager: [out, optional], subordinate: [in, required]}
    default: '0'
  awaddr:
    pattern: aw[._]?addr
    modes: {manager: [out, required]}
  awregion:
    pattern: aw[._]?region
    modes: {manager: [out, optional]}
    default: '0'
  awlen:
    pattern: aw[._]?len
    modes: {manager: [out, optional], subordinate: [in, required]}
    default: '0'
  awsize:
    pattern: aw[._]?size
    modes: {manager: [out, optional], subordinate: [in, required]}
    default: '3'
  awburst:
    pattern: aw[._]?burst
    modes: {manager: [out, optional], subordinate: [in, required]}
    default: '1'
  awlock:
    pattern: aw[._]?lock
    modes: {manager: [out, optional]}
    default: '0'
  awcache:
    pattern: aw[._]?cache
    modes: {manager: [out, optional]}
    default: '0'
  awprot:
    pattern: aw[._]?prot
    modes: {manager: [out, required], subordinate: [in, optional]}
  awqos:
    pattern: aw[._]?qos
    modes: {manager: [out, optional]}
    default: '0'
  awuser:
    pattern: aw[._]?user
    modes: {manager: [out, optional]}
  awvalid:
    pattern: aw[._]?valid
    modes: {manager: [out, required]}
  awready:
    pattern: aw[._]?ready
    modes: {manager: [in, required]}
  # W channel.
  wdata:
    pattern: w[._]?data
    modes: {manager: [out, required]}
  wstrb:
    pattern: w[._]?strb
    modes: {manager: [out, optional], subordinate: [in, required]}
    default: '255'
  wlast:
    pattern: w[._]?last
    modes: {manager: [out, required], subordinate: [in, optional]}
  wuser:
    pattern: w[._]?user
    modes: {manager: [out, optional]}
  wvalid:
    pattern: w[._]?valid
    modes: {manager: [out, required]}
  wready:
    pattern: w[._]?ready
    modes: {manager: [in, required]}
  # B channel.
  bid:
    pattern: b[._]?id
    modes: {manager: [in, optional], subordinate: [out, required]}
  bresp:
    pattern: b[._]?resp
    modes: {manager: [in, optional], subordinate: [out, required]}
    default: '0'
  buser:
    pattern: b[._]?user
    modes: {manager: [in, optional]}
  bvalid:
    pattern: b[._]?valid
    modes: {manager: [in, required]}
  bready:
    pattern: b[._]?ready
    modes: {manager: [out, required]}
  # AR channel.
  arid:
    pattern: ar[._]?id
    modes: {manager: [out, optional], subordinate: [in, required]}
    default: '0'
  araddr:
    pattern: ar[._]?addr
    modes: {manager: [out, required]}
  arregion:
    pattern: ar[._]?region
    modes: {manager: [out, optional]}
    default: '0'
  arlen:
    pattern: ar[._]?len
    modes: {manager: [out, optional], subordinate: [in, required]}
    default: '0'
  arsize:
    pattern: ar[._]?size
    modes: {manager: [out, optional], subordinate: [in, required]}
    default: '3'
  arburst:
    pattern: ar[._]?burst
    modes: {manager: [out, optional], subordinate: [in, required]}
    default: '1'
  arlock:
    pattern: ar[._]?lock
    modes: {manager: [out, optional]}
    default: '0'
  arcache:
    pattern: ar[._]?cache
    modes: {manager: [out, optional]}
    default: '0'
  arprot:
    pattern: ar[._]?prot
    modes: {manager: [out, required], subordinate: [in, optional]}
  arqos:
    pattern: ar[._]?qos
    modes: {manager: [out, optional]}
    default: '0'
  aruser:
    pattern: ar[._]?user
    modes: {manager: [out, optional]}
  arvalid:
    pattern: ar[._]?valid
    modes: {manager: [out, required]}
  arready:
    pattern: ar[._]?ready
    modes: {manager: [in, required]}
  # R channel.
  rid:
    pattern: r[._]?id
    modes: {manager: [in, optional], subordinate: [out, required]}
  rdata:
    pattern: r[._]?data
    modes: {manager: [in, required]}
  rresp:
    pattern: r[._]?resp
    modes: {manager: [in, optional], subordinate: [out, required]}
    default: '0'
  rlast:
    pattern: r[._]?last
    modes: {manager: [in, optional], subordinate: [out, required]}
  ruser:
    pattern: r[._]?user
    modes: {manager: [in, optional]}
  rvalid:
    pattern: r[._]?valid
    modes: {manager: [in, required]}
  rready:
    pattern: r[._]?ready
    modes: {manager: [out, required]}
