# Signal description
# - https://developer.arm.com/documentation/ihi0022/e (version E), pages: 113,126

id:
  library: topwrap-interfaces
  name: axi4lite
  vendor: antmicro.com

signals:
  # AW channel.
  awid:
    pattern: aw[._]?id
    modes: {manager: [out, optional]}
  awaddr:
    pattern: aw[._]?addr
    modes: {manager: [out, required]}
  awprot:
    pattern: aw[._]?prot
    modes: {manager: [out, required], subordinate: [in, optional]}
  awuser:
    pattern: aw[._]?user
    modes: {manager: [out, optional]}
  awvalid:
    pattern: aw[._]?valid
    modes: {manager: [out, required]}
  awready:
    pattern: aw[._]?ready
    modes: {manager: [in, required]}
  # W channel.
  wdata:
    pattern: w[._]?data
    modes: {manager: [out, required]}
  wstrb:
    pattern: w[._]?strb
    modes: {manager: [out, optional], subordinate: [in, required]}
    default: '255'
  wuser:
    pattern: w[._]?user
    modes: {manager: [out, optional]}
  wvalid:
    pattern: w[._]?valid
    modes: {manager: [out, required]}
  wready:
    pattern: w[._]?ready
    modes: {manager: [in, required]}
  # B channel.
  bid:
    pattern: b[._]?id
    modes: {manager: [in, optional]}
  bresp:
    pattern: b[._]?resp
    modes: {manager: [in, optional], subordinate: [out, required]}
  buser:
    pattern: b[._]?user
    modes: {manager: [in, optional]}
  bvalid:
    pattern: b[._]?valid
    modes: {manager: [in, required]}
  bready:
    pattern: b[._]?ready
    modes: {manager: [out, required]}
  # AR channel.
  arid:
    pattern: ar[._]?id
    modes: {manager: [out, optional]}
  araddr:
    pattern: ar[._]?addr
    modes: {manager: [out, required]}
  arprot:
    pattern: ar[._]?prot
    modes: {manager: [out, required], subordinate: [in, optional]}
  aruser:
    pattern: ar[._]?user
    modes: {manager: [out, optional]}
  arvalid:
    pattern: ar[._]?valid
    modes: {manager: [out, required]}
  arready:
    pattern: ar[._]?ready
    modes: {manager: [in, required]}
  # R channel.
  rid:
    pattern: r[._]?id
    modes: {manager: [in, optional]}
  rdata:
    pattern: r[._]?data
    modes: {manager: [in, required]}
  rresp:
    pattern: r[._]?resp
    modes: {manager: [in, optional], subordinate: [out, required]}
    default: '0'
  rlast:
    pattern: r[._]?last
    modes: {manager: [in, optional]}
    default: '1'
  ruser:
    pattern: r[._]?user
    modes: {manager: [in, optional]}
  rvalid:
    pattern: r[._]?valid
    modes: {manager: [in, required]}
  rready:
    pattern: r[._]?ready
    modes: {manager: [out, required]}
