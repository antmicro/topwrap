# Signals specification
# - https://developer.arm.com/documentation/ihi0051/latest (version B), page 52
id:
  library: topwrap-interfaces
  name: axi4stream
  vendor: antmicro.com

signals:
  # assuming transmitter = manager
  TVALID:
    pattern: tvalid
    modes: {manager: [out, required]}
  TREADY:
    pattern: tready
    modes: {manager: [in, optional]}
    default: '1'
  TDATA:
    pattern: tdata
    modes: {manager: [out, optional]}
    default: '0'
  TSTRB:
    pattern: tstrb
    modes: {manager: [out, optional]}
  TKEEP:
    pattern: tkeep
    modes: {manager: [out, optional]}
  TLAST:
    pattern: tlast
    modes: {manager: [out, optional]}
  TID:
    pattern: tid
    modes: {manager: [out, optional]}
  TDEST:
    pattern: tdest
    modes: {manager: [out, optional]}
  TUSER:
    pattern: tuser
    modes: {manager: [out, optional]}
