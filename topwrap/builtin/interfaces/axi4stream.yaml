# Signals specification
# - https://developer.arm.com/documentation/ihi0051/latest (version B), page 52
id:
  library: topwrap-interfaces
  name: axi4stream
  vendor: antmicro.com

signals:
  # assuming transmitter = manager
  tvalid:
    pattern: tvalid
    modes: {manager: [out, required]}
  tready:
    pattern: tready
    modes: {manager: [in, optional]}
    default: '1'
  tdata:
    pattern: tdata
    modes: {manager: [out, optional]}
    default: '0'
  tstrb:
    pattern: tstrb
    modes: {manager: [out, optional]}
  tkeep:
    pattern: tkeep
    modes: {manager: [out, optional]}
  tlast:
    pattern: tlast
    modes: {manager: [out, optional]}
  tid:
    pattern: tid
    modes: {manager: [out, optional]}
  tdest:
    pattern: tdest
    modes: {manager: [out, optional]}
  tuser:
    pattern: tuser
    modes: {manager: [out, optional]}
